name: Rust orchestrator pilot
on:
  push:
    paths: ['skills/orchestrator-rs/**', 'skills/orchestrator/**', 'shared/sdk/**', 'plugins/nen/**', 'scripts/*rust*', 'scripts/orchestrator-dispatch.py', '.github/workflows/rust-orchestrator.yml']
  pull_request:
    paths: ['skills/orchestrator-rs/**', 'skills/orchestrator/**', 'shared/sdk/**', 'plugins/nen/**', 'scripts/*rust*', 'scripts/orchestrator-dispatch.py', '.github/workflows/rust-orchestrator.yml']
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/skills/orchestrator-rs/target
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version-file: skills/orchestrator/go.mod
          cache-dependency-path: skills/orchestrator/go.sum
      - name: Build paired runtime and helpers
        working-directory: skills/orchestrator-rs
        run: cargo build --locked -p orchestrator-first-use-pilot --bins -p orchestrator-process --bin orchestrator-process-broker
      - name: Pilot tests
        working-directory: skills/orchestrator-rs
        run: |
          cargo test --locked -p orchestrator-first-use-pilot
          cargo test --locked -p orchestrator-provider-claude --features experimental-first-use-pilot
      - name: Format and Clippy
        working-directory: skills/orchestrator-rs
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p orchestrator-first-use-pilot --all-targets -- -D warnings
      - name: Source install into isolated prefix
        run: python3 scripts/install-rust-orchestrator.py --profile dev --prefix "$RUNNER_TEMP/nanika prefix"
      - name: Offline installer and dispatch smoke
        run: python3 scripts/test-rust-install.py --prefix "$RUNNER_TEMP/nanika prefix"
