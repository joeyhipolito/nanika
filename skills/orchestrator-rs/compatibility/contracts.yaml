    missing_observation: "cli_oracle_matrix censuses help, usage and flag-parsing exits only; the documented backfill-embeddings exits 2, 3 and 4 are observed by no enrolled gate."
    classification: exact
    area: cli
    summary: Cobra-compatible command discovery, global flags, help, errors, and process exits.
    requirements:
      - "Binary name is orchestrator; help/version requests and successful commands exit 0."
      - "General Cobra validation and RunE failures print an error to stderr and exit 1; backfill-embeddings directly exits 2 for invalid batch-size/since, 3 for missing Gemini credentials under --apply, and 4 when one or more rows fail."
      - "Persistent flags and defaults: -v/--verbose=false, --dry-run=false, --domain=dev, --model='', --sequential=false, --personas-dir='', --nanika-dir='', --max-turns=0."
      - "Persistent flags are accepted before or after every descendant command and explicit persona/nanika directory flags override their package defaults."
