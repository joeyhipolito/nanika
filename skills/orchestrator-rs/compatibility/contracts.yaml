schema_version: 1
ledger_id: orchestrator-go-to-rust
title: Go orchestrator to Rust compatibility ledger
baseline:
  implementation: skills/orchestrator
  git_commit: 3f2e5d1b
  observed_on: "2026-07-13"
  normative_document: docs/rust-orchestrator/compatibility-contract.md

classification_definitions:
  exact: Observable behavior, name, default, ordering, or representation must match.
  versioned: Readers preserve old data/wire versions; writers emit the documented current version.
  intentional-fix: Rust deliberately differs to correct a named safety or correctness defect.
  retired: Runtime behavior is not implemented in Rust; preservation rules may still apply to its data.

disposition_definitions:
  implement: Implement and test in Rust.
  preserve: Never delete, rewrite, migrate, or claim ownership of the existing artifact unless a later versioned migration explicitly does so.
  read_only: May inspect but must not mutate the artifact.
  omit: Do not expose or execute the runtime behavior.

contracts:
